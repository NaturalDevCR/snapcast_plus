name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements_test.txt

      - name: Run pytest
        run: .venv/bin/python -m pytest tests/ -v

  # No hassfest job: this integration deliberately registers the core
  # `snapcast` domain from a flat repo (drop-in replacement), which hassfest
  # rejects by design ("domain collides with built-in core integration").
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
